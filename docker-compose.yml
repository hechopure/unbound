services:
  unbound:
    image: hechopure/unbound:latest
#   build: .
    container_name: unbound
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=50m
      - /var/cache/unbound:size=100m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.200.201:5353:5353/tcp"
      - "192.168.200.201:5353:5353/udp"
    volumes:
      - unbound-data:/var/lib/unbound:rw
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  unbound-data:

